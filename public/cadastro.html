<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Criar conta | A Engenharia da Perfumaria</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;1,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/LogCadas.css">

</head>

<body>
  <main class="pagina">

    <section class="capa">
      <div class="frasco" aria-hidden="true">
        <div class="tampa"></div>
        <div class="gargalo"></div>
        <div class="vidro"><div class="liquido"></div></div>
      </div>
      <h1>A Engenharia da Perfumaria</h1>
      <p class="subtitulo">Minha história através das fragrâncias</p>
    </section>

    <section class="acesso">
      <div class="caixa">
        <h2>Criar conta</h2>
        <form id="form-cadastro" action="#" method="post">
          <p class="chamada">Crie sua conta para receber uma saudação com o seu nome.</p>

          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" autocomplete="given-name" required>

          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="email" required>

          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" autocomplete="new-password" minlength="8" required>
          <small>Use pelo menos 8 caracteres.</small>

          <label for="confirma">Confirmar senha</label>
          <input type="password" id="confirma" name="confirma" autocomplete="new-password" minlength="8" required>

          <p id="mensagem" class="mensagem" role="alert"></p>

          <button type="submit">Criar conta</button>
        </form>
        <p class="troca">Já tem conta? <a href="login.html">Entrar</a></p>
      </div>
    </section>

  </main>
    <script>
    let formulario = document.getElementById('form-cadastro');
    let mensagem = document.getElementById('mensagem');
    let botao = formulario.querySelector('button');

    function mostrar(texto, tipo) {
      mensagem.textContent = texto;
      mensagem.className = 'mensagem ' + tipo;
    }

    formulario.addEventListener('submit', (evento) => {
      evento.preventDefault();
      mostrar('', '');

      let senha = document.getElementById('senha').value;
      let confirma = document.getElementById('confirma').value;

      // Validação no navegador: as duas senhas precisam ser iguais
      if (senha !== confirma) {
        mostrar('As senhas não são iguais.', 'erro');
        return;
      }

      botao.disabled = true;

      // Envia os dados para a API (rota POST /usuarios/cadastrar)
      fetch('/usuarios/cadastrar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nomeServer: document.getElementById('nome').value,
          emailServer: document.getElementById('email').value,
          senhaServer: senha
        })
      })
        .then((resposta) => {
          if (resposta.ok) {
            mostrar('Conta criada! Levando você para o login...', 'sucesso');
            setTimeout(() => { window.location = 'login.html'; }, 1500);
          } else {
            resposta.text().then((texto) => mostrar(texto, 'erro'));
            botao.disabled = false;
          }
        })
        .catch(() => {
          mostrar('Não foi possível falar com o servidor. Tente novamente.', 'erro');
          botao.disabled = false;
        });
    });
  </script>
</body>
</html>
