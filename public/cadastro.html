<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Criar conta | A Engenharia da Perfumaria</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;1,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/LogCadas.css">

  <link rel="stylesheet" href="css/transicao.css">
<script src="js/transicao.js" defer></script>
</head>

<body>
  <main class="pagina">

    <section class="capa">
      <div class="frasco" aria-hidden="true">
        <div class="tampa"></div>
        <div class="gargalo"></div>
        <div class="vidro"><div class="liquido"></div></div>
      </div>
      <h1>A Engenharia da Perfumaria</h1>
      <p class="subtitulo">Minha história através das fragrâncias</p>
    </section>

    <section class="acesso">
      <div class="caixa">
        <h2>Criar conta</h2>
        <form id="form-cadastro" action="#" method="post">
          <p class="chamada">Crie sua conta para receber uma saudação com o seu nome.</p>

          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" autocomplete="given-name" required>

          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="email" required>

          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" autocomplete="new-password" minlength="8" required>
                    <div class="forca" id="forca" hidden>
            <div class="forca-trilho"><div class="forca-barra" id="forca-barra"></div></div>
            <p class="forca-texto" id="forca-texto"></p>
            <ul class="requisitos" id="requisitos"></ul>
          </div>

          <label for="confirma">Confirmar senha</label>
          <input type="password" id="confirma" name="confirma" autocomplete="new-password" minlength="8" required>

          <p id="mensagem" class="mensagem" role="alert"></p>

          <button type="submit">Criar conta</button>
        </form>
        <p class="troca">Já tem conta? <a href="login.html">Entrar</a></p>
      </div>
    </section>

  </main>
    <script>
if (sessionStorage.getItem('NOME_USUARIO')) { window.location = 'index.html'; }

    let formulario = document.getElementById('form-cadastro');
    let mensagem = document.getElementById('mensagem');
    let botao = formulario.querySelector('button');

    function mostrar(texto, tipo) {
      mensagem.textContent = texto;
      mensagem.className = 'mensagem ' + tipo;
    }

    let REQUISITOS = [
      { texto: 'Mínimo de 8 caracteres', ok: (s) => s.length >= 8 },
      { texto: 'Letra maiúscula', ok: (s) => /\p{Lu}/u.test(s) },
      { texto: 'Letra minúscula', ok: (s) => /\p{Ll}/u.test(s) },
      { texto: 'Número', ok: (s) => /\p{N}/u.test(s) },
      { texto: 'Caractere especial (!, @, #, $...)', ok: (s) => /[^\p{L}\p{N}]/u.test(s) }
    ];

    let campoSenha = document.getElementById('senha');
    let blocoForca = document.getElementById('forca');
    let barraForca = document.getElementById('forca-barra');
    let textoForca = document.getElementById('forca-texto');
    let listaRequisitos = document.getElementById('requisitos');
    let itensRequisitos = [];

    for (let i = 0; i < REQUISITOS.length; i++) {
      let item = document.createElement('li');
      listaRequisitos.appendChild(item);
      itensRequisitos.push(item);
    }

    function atualizarForca() {
      let senha = campoSenha.value;
      let atendidos = 0;

      for (let i = 0; i < REQUISITOS.length; i++) {
        let cumprido = REQUISITOS[i].ok(senha);
        if (cumprido) { atendidos++; }
        itensRequisitos[i].textContent = (cumprido ? '✓ ' : '✗ ') + REQUISITOS[i].texto;
        itensRequisitos[i].className = cumprido ? 'ok' : '';
      }

      let nivel = 'fraca';
      let texto = 'Senha fraca';
      if (atendidos === REQUISITOS.length) {
        nivel = 'forte';
        texto = 'Senha forte';
      } else if (atendidos >= 3) {
        nivel = 'media';
        texto = 'Senha média';
      }

      blocoForca.hidden = senha === '';
      barraForca.style.width = (atendidos / REQUISITOS.length * 100) + '%';
      barraForca.className = 'forca-barra ' + nivel;
      textoForca.textContent = texto;
      textoForca.className = 'forca-texto ' + nivel;
    }

    campoSenha.addEventListener('input', atualizarForca);
    atualizarForca();

    formulario.addEventListener('submit', (evento) => {
      evento.preventDefault();
      mostrar('', '');

      let senha = document.getElementById('senha').value;
      let confirma = document.getElementById('confirma').value;

      if (senha !== confirma) {
        mostrar('As senhas não são iguais.', 'erro');
        return;
      }

      for (let i = 0; i < REQUISITOS.length; i++) {
        if (!REQUISITOS[i].ok(senha)) {
          mostrar('A senha precisa cumprir: ' + REQUISITOS[i].texto.toLowerCase() + '.', 'erro');
          return;
        }
      }

      botao.disabled = true;

      fetch('/usuarios/cadastrar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nomeServer: document.getElementById('nome').value,
          emailServer: document.getElementById('email').value,
          senhaServer: senha
        })
      })
        .then((resposta) => {
          if (resposta.ok) {
            mostrar('Conta criada! Levando você para o login...', 'sucesso');
            setTimeout(() => { window.location = 'login.html'; }, 1500);
          } else {
            resposta.text().then((texto) => mostrar(texto, 'erro'));
            botao.disabled = false;
          }
        })
        .catch(() => {
          mostrar('Não foi possível falar com o servidor. Tente novamente.', 'erro');
          botao.disabled = false;
        });
    });
  </script>
</body>
</html>
