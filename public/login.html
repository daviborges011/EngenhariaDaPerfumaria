<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Entrar | A Engenharia da Perfumaria</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;1,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/LogCadas.css">

</head>

<body>
  <main class="pagina pagina-cadastro">

    <section class="capa">
      <div class="frasco" aria-hidden="true">
        <div class="tampa"></div>
        <div class="gargalo"></div>
        <div class="vidro"><div class="liquido"></div></div>
      </div>
      <h1>A Engenharia da Perfumaria</h1>
      <p class="subtitulo">Minha história através das fragrâncias</p>
    </section>

    <section class="acesso">
      <div class="caixa">
        <h2>Entrar</h2>
        <form id="form-entrar" action="#" method="post">
          <p class="chamada">Que bom te ver por aqui. Entre para continuar a história.</p>

          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="email" required>

          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" autocomplete="current-password" required>

            <p id="mensagem" class="mensagem" role="alert"></p>

          <button type="submit">Entrar</button>
        </form>
        <p class="troca">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
      </div>
    </section>

  </main>
    <script>
    let formulario = document.getElementById('form-entrar');
    let mensagem = document.getElementById('mensagem');
    let botao = formulario.querySelector('button');

    function mostrar(texto, tipo) {
      mensagem.textContent = texto;
      mensagem.className = 'mensagem ' + tipo;
    }

    formulario.addEventListener('submit', (evento) => {
      evento.preventDefault();
      mostrar('', '');
      botao.disabled = true;

      // Envia e-mail e senha para a API (rota POST /usuarios/autenticar)
      fetch('/usuarios/autenticar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          emailServer: document.getElementById('email').value,
          senhaServer: document.getElementById('senha').value
        })
      })
        .then((resposta) => {
          if (resposta.ok) {
            resposta.json().then((dados) => {
              // Guarda quem entrou (o index e o dashboard leem estes valores)
              sessionStorage.EMAIL_USUARIO = dados.email;
              sessionStorage.NOME_USUARIO = dados.nome;
              sessionStorage.ID_USUARIO = dados.id;
              window.location = 'index.html';
            });
          } else {
            resposta.text().then((texto) => mostrar(texto, 'erro'));
            botao.disabled = false;
          }
        })
        .catch(() => {
          mostrar('Não foi possível falar com o servidor. Tente novamente.', 'erro');
          botao.disabled = false;
        });
    });
  </script>
</body>
</html>
